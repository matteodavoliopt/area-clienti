<title>Programma Cliente di prova</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style id="st">
/* Layout: one narrow column like a phone training log; day chips on top, exercise rows as a numbered list, coach toolbar pinned to the bottom edge */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --ink:#141C1A; --muted:#5D6B67; --line:#DCE2E0;
  --accent:#1B7D8D; --accent-ink:#FFFFFF; --accent-soft:#DDF0F2; --brand:#2397A9; --rest:#B4621A; --danger:#B3261E; --warn-ink:#7A5600; --warn-bg:#FCEBB0; --fig-shorts:#2F3A3D; --fig-shoe:#1E2426; --fig-shorts-far:#232C2E;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1413; --surface:#182120; --ink:#E8EEEC; --muted:#93A29E; --line:#2A3634;
  --accent:#4FC3D3; --accent-ink:#062126; --accent-soft:#13333A; --brand:#3FB4C5; --rest:#E39A57; --danger:#F08A82; --warn-ink:#F5CF5B; --warn-bg:#3B3112; --fig-shorts:#5E6E72; --fig-shoe:#9DB0B3; --fig-shorts-far:#4A585B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1413; --surface:#182120; --ink:#E8EEEC; --muted:#93A29E; --line:#2A3634;
  --accent:#4FC3D3; --accent-ink:#062126; --accent-soft:#13333A; --brand:#3FB4C5; --rest:#E39A57; --danger:#F08A82; --warn-ink:#F5CF5B; --warn-bg:#3B3112; --fig-shorts:#5E6E72; --fig-shoe:#9DB0B3; --fig-shorts-far:#4A585B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:640px;margin:0 auto;padding-block:20px 120px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font:700 13px/1 var(--display);letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.brand{display:flex;justify-content:flex-start;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand-txt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;text-align:left}
.brand-name{font:800 21px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.brand-role{font:600 clamp(7px,2.4vw,11px)/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.logo{flex:0 0 auto;width:40px;height:auto;fill:var(--brand);stroke:var(--brand);stroke-width:22;stroke-linejoin:round;overflow:visible}
.hero{display:flex;flex-direction:column;gap:6px}
.hero h1{font:800 clamp(44px,13vw,72px)/.9 var(--display);text-transform:uppercase;letter-spacing:.01em}
.hero p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:700 17px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:12px 8px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.plan-goal{display:flex;flex-direction:column;gap:4px}
.plan-goal span{font-size:18px;font-weight:600;line-height:1.3}
.plan-dates{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.plan-dates div{display:flex;flex-direction:column;gap:2px}
.plan-dates strong{font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.plan .eyebrow{font-size:12px}
.pland{padding:0;gap:0}
.pland summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}
.pland summary::-webkit-details-marker{display:none}
.pl-goal{font-size:18px;font-weight:600;line-height:1.3;color:var(--ink)}
.pland .bd-t small{color:var(--muted);font-size:13px}
.pland[open] .chev{transform:rotate(180deg)}
.pers-iss{white-space:pre-wrap;font-size:16px !important;font-weight:500 !important}
.plan-in{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.prog{display:flex;flex-direction:column;gap:6px}
.prog-bar{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog small{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 18px/1 var(--display);letter-spacing:.05em;padding:10px 16px;border-radius:999px;cursor:pointer;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day-head{display:flex;flex-direction:column;gap:2px}
.day-head h2{font:800 34px/1 var(--display);text-transform:uppercase}
.day-head p{margin:0;color:var(--muted)}
.block{border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.block b{display:block;font:700 14px/1.2 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.mob{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.mob li{display:grid;grid-template-columns:minmax(0,150px) 1fr;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px}
.mob li.txt{display:block;background:none;border:0;padding:0}
.mob li span{min-width:0;font-size:14.5px;line-height:1.35}
.blockd{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px}
.blockd summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.blockd summary::-webkit-details-marker{display:none}
.bd-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.bd-t b{font:700 14px/1.2 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.bd-t small{color:var(--muted);font-size:13px}
.chev{flex:0 0 auto;width:18px;height:18px;transition:transform .2s}
.chev path{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.blockd[open] .chev{transform:rotate(180deg)}
.blockd .mob{margin:0;padding:0 10px 10px}
.mob-sub{color:var(--muted)}
.tm{grid-column:2/4;display:flex;align-items:center;gap:8px;margin-top:2px;padding:4px 6px 4px 4px;border:1px solid var(--line);border-radius:999px;max-width:210px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tm button{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;padding:0;background:var(--rest);color:var(--accent-ink)}
.tm button.tm-rs{background:none;color:var(--muted);width:26px;height:26px}
.tm button svg{width:12px;height:12px;fill:currentColor}
.tm button.tm-rs svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tm-t{font-weight:700;font-size:14px;color:var(--rest);min-width:42px}
.tm-bar{flex:1 1 auto;height:4px;border-radius:2px;background:var(--line);overflow:hidden;min-width:40px}
.tm-bar i{display:block;height:100%;width:0;background:var(--rest);transition:width .25s linear}
.tm.done{border-color:var(--rest)} .tm.done .tm-t{font-family:var(--body)}
.tmc{margin:0 10px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px;font-variant-numeric:tabular-nums}
.tmc button{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;padding:0;background:var(--accent);color:var(--accent-ink);grid-row:1/3}
.tmc button.tm-rs{background:none;color:var(--muted);width:32px;height:32px;grid-column:3;grid-row:1/3}
.tmc button svg{width:16px;height:16px;fill:currentColor}
.tmc button.tm-rs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tmc .tm-t{font:700 26px/1 var(--mono);color:var(--accent)}
.tmc .tm-ph{font-size:12.5px;color:var(--muted);grid-column:2}
.tmc .tm-bar{grid-column:1/4;margin-top:6px}
.tmc .tm-bar i{background:var(--accent)}
.tmc.rest .tm-t,.tmc.prep .tm-t{color:var(--rest)} .tmc.rest .tm-bar i,.tmc.prep .tm-bar i{background:var(--rest)} .tmc.rest button:not(.tm-rs){background:var(--rest)}
.tmc.done .tm-t{font:700 18px/1.2 var(--body)}
.mob li.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tmc.rest ~ .mob li.cur{border-color:var(--rest);box-shadow:0 0 0 1px var(--rest)}

.mob-sr{display:block;margin-top:4px;font:700 13px/1 var(--mono);font-style:normal;color:var(--ink)}
.illu{width:100%;height:auto;display:block}
.illu .ip{fill:var(--line)}
.illu .ifl{stroke:var(--muted);stroke-width:2;opacity:.5}
.illu .iar path{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.block div{white-space:pre-wrap}
.ex-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ex{display:grid;grid-template-columns:28px 1fr auto;gap:4px 12px;padding:14px 16px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .n{font:700 20px/1.3 var(--display);color:var(--muted)}
.ex .name{min-width:0;font-weight:600;font-size:16px;line-height:1.3}
.ex .meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.sr{font-weight:700;color:var(--ink)}
.rec{color:var(--rest)}
.info{grid-column:2/4;color:var(--muted);font-size:14px}
.vids{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px}
.thumbs{grid-column:2/4;display:grid;gap:8px;margin:4px 0 2px}
.thumbs.many{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.thumb{position:relative;display:block;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:var(--accent-soft);text-decoration:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.noimg img{display:none}
.thumb .play{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(0,0,0,.62);display:grid;place-items:center}
.thumb .play svg{width:22px;height:22px;fill:#fff;margin-left:2px}
.thumbs.many .thumb .play{width:38px;height:38px;margin:-19px 0 0 -19px}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font:600 12.5px/1.2 var(--body);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb.noimg .cap{background:none;color:var(--accent);position:static;padding:8px}
.log{grid-column:2/4;display:flex;flex-direction:column;gap:6px;margin-top:4px;min-width:0}
.log-lab{font:700 11px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.log-weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.wk{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;min-width:52px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:500 12.5px/1.25 var(--mono);font-variant-numeric:tabular-nums;max-width:140px}
.wk b{font:700 11px/1 var(--display);letter-spacing:.08em;color:var(--muted)}
.wk.now{border-color:var(--accent);background:var(--accent-soft)}
.wk.now b{color:var(--accent)}
.wk.empty{color:var(--muted);font-family:var(--body);border-style:dashed}
button.wk{cursor:pointer;color:var(--ink);text-align:left}
button.wk.empty{color:var(--accent)}
.wk.mine{border-color:var(--rest)}
.wk i{font:600 10px/1 var(--body);font-style:normal;color:var(--rest);text-transform:uppercase;letter-spacing:.04em}
.le{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft)}
.le label{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.le input{font:16px/1.4 var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.le small{color:var(--muted);font-size:12.5px}
.le-btns{display:flex;justify-content:flex-end;gap:8px}
.le textarea{font:15px/1.4 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;resize:vertical}
.ie{grid-column:2/4}
.info-ed{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.info-ed .ph{font-style:italic}
.info-ed i{font:600 10px/1 var(--body);font-style:normal;color:var(--rest);text-transform:uppercase;letter-spacing:.04em}
.pen{border:0;background:none;padding:2px 0;color:var(--accent);font:600 13px/1.2 var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.log-ed{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.log-ed .weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.log-ed .weeks label{flex:0 0 76px}
.vid-ed{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr auto;gap:6px;align-items:end}
@media (max-width:420px){.vid-ed{grid-template-columns:1fr auto}.vid-ed label:nth-child(2){grid-column:1/-1;grid-row:2}}
.vid{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--accent);background:var(--accent-soft);font:600 13px/1 var(--body);padding:7px 10px;border-radius:8px;white-space:nowrap;align-self:start}
.vid svg{width:12px;height:12px;fill:currentColor}
.note{background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.note b{font:700 14px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.note p{margin:6px 0 0;white-space:pre-wrap}
.pkg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pkg-nums{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pkg-nums div{display:flex;flex-direction:column;gap:2px}
.pkg-nums strong{font:800 44px/.9 var(--display);font-variant-numeric:tabular-nums}
.pkg-nums .left strong{color:var(--accent)}
.pkg .eyebrow{font-size:12px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.pkg small{color:var(--muted);font-size:13px}
.pay{align-self:flex-start;font:700 13px/1 var(--body);padding:7px 10px;border-radius:999px;margin-top:-4px}
.pay.ok{color:var(--accent);background:var(--accent-soft)}
.pay.rata{color:var(--warn-ink);background:var(--warn-bg)}
.seg button[data-v="rata"][aria-pressed="true"]{background:var(--warn-bg);color:var(--warn-ink)}
.pay.no{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.policy{margin:0;display:flex;gap:8px;align-items:flex-start;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.4;color:var(--muted)}
.policy svg{flex:0 0 auto;width:16px;height:16px;margin-top:1px;color:var(--rest)}
.policy strong{color:var(--ink);font-weight:600}
.pkg-coach{display:flex;flex-direction:column;gap:12px;padding-top:12px;border-top:1px dashed var(--line)}
.pkg-coach .pkg-ctl{padding-top:0;border-top:0}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:600 14px/1 var(--body);padding:9px 6px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pkg-ctl{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:12px;border-top:1px dashed var(--line)}
.pkg-ctl>div{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px}
.step b{min-width:2ch;text-align:center;font:800 24px/1 var(--display);font-variant-numeric:tabular-nums}
.step .btn{width:38px;height:38px;padding:0;font-size:20px;line-height:1}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.cal-nav{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.cal-nav:disabled{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-w{font:700 11px/1 var(--display);letter-spacing:.1em;color:var(--muted);padding:4px 0}
.cal-d{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:50%;font:600 14px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--ink);border:2px solid transparent}
.cal-d.done{background:var(--accent);color:var(--accent-ink)}
.cal-d.mass{background:var(--rest);color:var(--accent-ink)}
.cal-d.up{border-color:var(--accent);border-style:dashed}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-d.done.today,.cal-d.mass.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.cal-foot{color:var(--muted);font-size:14px}
.cal-foot strong{font:800 22px/1 var(--display);color:var(--accent)}
.cal-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.cal-leg span{display:inline-flex;align-items:center;gap:6px}
.lg{width:12px;height:12px;border-radius:50%;display:inline-block}
.lg.done{background:var(--accent)} .lg.mass{background:var(--rest)} .lg.up{border:2px dashed var(--accent)}
.next{background:var(--ink);color:var(--bg);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px}
.next .eyebrow{color:inherit;opacity:.7}
.next .when{font:800 32px/1 var(--display);text-transform:uppercase}
.next .sub{opacity:.8}
.appts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.appt{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.appt .date{font:700 15px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.appt .date strong{display:block;font-size:28px;color:var(--ink)}
.appt .what{min-width:0}
.appt .what span{display:block;color:var(--muted);font-size:14px}
.past{opacity:.55}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center}
.foot{color:var(--muted);font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-weight:600;padding:8px 0}
/* coach toolbar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar-in .msg{flex:1 1 160px;min-width:0;color:var(--muted);font-size:14px}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px/1 var(--body);padding:11px 16px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{font-size:13px;padding:8px 12px}
.btn.ghost{border-style:dashed;color:var(--muted)}
.btn.del{color:var(--danger);border-color:transparent;background:none;padding:8px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* editor */
.ed{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
input,textarea{font:15px/1.4 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex-ed{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ex-ed input{background:var(--surface)}
.ex-ed .full{grid-column:1/-1}
.ex-ed .tools{grid-column:1/-1;display:flex;justify-content:flex-end;gap:4px}
@media (max-width:420px){.ex-ed{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function calendar(list){

  var y=base.getFullYear(), m=base.getMonth(), nd=new Date(y,m+1,0).getDate(), lead=(base.getDay()+6)%7, map={}, done=0;
  list.forEach(function(a){ var d=parseD(a); if(d.getFullYear()!==y||d.getMonth()!==m) return; var k=d.getDate(), past=d<now, les=isLesson(a);
    var c=map[k]||(map[k]={}); if(past){ if(les){ c.done=true; done++; } else c.mass=true; } else c.up=true; });
  var mn=new Intl.DateTimeFormat('it-IT',{month:'long',year:'numeric'}).format(base);
  var h='<section class="cal" aria-label="Calendario di '+esc(mn)+'"><div class="cal-head"><button type="button" class="cal-nav" data-act="calPrev" aria-label="Mese precedente">‹</button><b>'+esc(mn)+'</b><button type="button" class="cal-nav" data-act="calNext" aria-label="Mese successivo"'+(off>=1?' disabled':'')+'>›</button></div><div class="cal-grid">';
  ['L','M','M','G','V','S','D'].forEach(function(w){ h+='<span class="cal-w">'+w+'</span>'; });
  for(var i=0;i<lead;i++) h+='<span></span>';
  var isCur = (y===now.getFullYear() && m===now.getMonth());
  for(var dd=1; dd<=nd; dd++){ var c=map[dd]||{}, cls='cal-d'+(c.done?' done':(c.mass?' mass':''))+(c.up?' up':'')+(isCur&&dd===now.getDate()?' today':'');

  return h;

function render(){
  var h = '';
  if(ui.edit){
    h += BRAND+'<div class="hero"><span class="eyebrow">Modifica programma</span><h1>'+esc(firstName(draft.client.name))+'</h1></div>' + viewEdit();
  } else {
    var nA = S.appts.filter(function(a){ var n=new Date(); n.setHours(0,0,0,0); return a.d && parseD(a)>=n; }).length;
    h += BRAND+'<div class="hero"><span class="eyebrow">Area riservata</span><h1>'+esc(firstName(S.client.name))+'</h1><p>Tutto ciò che ti serve per allenarti con Matteo è qui, in maniera comoda e semplice in un’unica app!</p></div>';
    h += '<div class="tabs" role="tablist"><button role="tab" data-tab="train" aria-selected="'+(ui.tab==='train')+'">Programma</button><button role="tab" data-tab="appts" aria-selected="'+(ui.tab==='appts')+'">Appuntamenti'+(nA?' ('+nA+')':'')+'</button></div>';
    h += ui.tab==='train' ? viewTrain() : viewAppts();
    if(S.updated){ try{ h += '<p class="foot">Aggiornato il '+esc(fmtUpd.format(parseD({d:S.updated})))+'</p>'; }catch(e){} }
  }
  if(ui.canEdit){
    h += '<div class="bar"><div class="bar-in"><span class="msg" aria-live="polite">'+esc(ui.msg || (ui.dirty && !ui.edit ? 'Modifiche al pacchetto: premi Salva per mostrarle al cliente.' : ui.edit?'Le modifiche diventano visibili al cliente quando salvi.':'Vista coach: solo tu vedi questa barra.'))+'</span>'+
      (ui.dirty && !ui.edit ? '<button class="btn" data-act="discard">Annulla</button><button class="btn primary" data-act="save"'+(ui.saving?' disabled':'')+'>'+(ui.saving?'Salvataggio…':'Salva')+'</button>' : ui.edit ? '<button class="btn" data-act="cancel">Annulla</button><button class="btn primary" data-act="save"'+(ui.saving?' disabled':'')+'>'+(ui.saving?'Salvataggio…':'Salva')+'</button>'
               : '<button class="btn primary" data-act="edit">Modifica</button>')+'</div></div>';
  }
  app.innerHTML = h;
  try{ tmPaint(); }catch(err){}
  try{ document.querySelectorAll('.log-weeks').forEach(function(el){ var n=el.querySelector('.now'); if(n) el.scrollLeft = Math.max(0, n.offsetLeft - el.offsetLeft - 60); }); }catch(err){}
}

function setPath(obj,path,val){ var p=path.split('.'), o=obj; for(var i=0;i<p.length-1;i++){ if(o[p[i]]==null) o[p[i]] = /^\d+$/.test(p[i+1]) ? [] : {}; o=o[p[i]]; } o[p[p.length-1]]=val; }

app.addEventListener('change', function(e){
  var k = e.target.getAttribute && e.target.getAttribute('data-pkg');
  if(k && !ui.edit){ S.pkg=S.pkg||{total:'',done:''}; S.pkg[k]=e.target.value; ui.dirty=true; ui.msg=''; var y2=window.scrollY; render(); window.scrollTo(0,y2); }
});

function saveLog(){
  var inp2=document.getElementById('le-in'); if(!inp2 || !ui.le) return;
  var v=inp2.value.trim(), L=ui.le, e=findEx(L.d,L.n); if(!e) return;
  var k=pkey(L.d,e,L.w);
  if(v===((e.log||[])[L.w-1]||'').trim() && !PEND[k]){ ui.le=null; render(); return; }
  PEND[k]={d:L.d,dn:(S.days[L.d]||{}).name||'',n:e.n,w:L.w,v:v,ts:Date.now(),sent:false};
  pendSave(); ui.le=null; var y4=window.scrollY; render(); window.scrollTo(0,y4); sendPend(k);
}
app.addEventListener('keydown', function(e){ if(e.target.id==='le-in' && e.key==='Enter'){ e.preventDefault(); saveLog(); } });

app.addEventListener('toggle', function(e){ var k=e.target && e.target.getAttribute && e.target.getAttribute('data-blk'); if(k!=null){ ui.ob=ui.ob||{}; ui.ob[k]=e.target.open; } }, true);

app.addEventListener('input', function(e){
  var p = e.target.getAttribute && e.target.getAttribute('data-p');
  if(p && draft){ setPath(draft,p,e.target.value); if(/^days\.\d+\.name$/.test(p)){ var h3=e.target.closest('.card').querySelector('h3'); if(h3) h3.textContent=e.target.value; } }
});

app.addEventListener('click', function(e){

  if(b.dataset.tab){ ui.tab=b.dataset.tab; render(); return; }
  if(b.dataset.day){ ui.day=+b.dataset.day; render(); return; }
  var a=b.dataset.act, i=+b.dataset.i, k=+b.dataset.k; if(!a) return;
  if(a==='edit'){ if(ui.dirty){ S=JSON.parse(ORIG); ui.dirty=false; } draft=JSON.parse(JSON.stringify(S)); draft.client.goal=draft.client.goal||''; draft.pkg=draft.pkg||{total:'',done:''}; ui.edit=true; ui.msg=''; render(); window.scrollTo(0,0); return; }
  if(a==='cancel'){ draft=null; ui.edit=false; ui.msg=''; render(); return; }
  if(a==='save'){ if(!ui.edit) draft=JSON.parse(JSON.stringify(S)); save(); return; }
  if(a==='discard'){ S=JSON.parse(ORIG); ui.dirty=false; ui.msg=''; render(); return; }
  if(a==='calPrev'||a==='calNext'){ ui.calOff=(ui.calOff||0)+(a==='calPrev'?-1:1); if(ui.calOff>1) ui.calOff=1; var y8=window.scrollY; render(); window.scrollTo(0,y8); return; }
  if(a==='pkgM'){ S.pkg=S.pkg||{total:'',done:''}; S.pkg.mode=b.dataset.v; ui.dirty=true; ui.msg=''; var y0=window.scrollY; render(); window.scrollTo(0,y0); return; }
  if(a==='pkgP'){ S.pkg=S.pkg||{total:'',done:''}; S.pkg.paid = b.dataset.v==='1' ? true : (b.dataset.v==='rata' ? 'rata' : false); if(S.pkg.paid) S.pkg.paidMonth=curYM(); ui.dirty=true; ui.msg=''; var y7=window.scrollY; render(); window.scrollTo(0,y7); return; }
  if(a==='pkgQ'){ S.pkg=S.pkg||{total:'',done:''}; S.pkg.month=String(Math.max(0,(parseInt(S.pkg.month,10)||0)+(+b.dataset.v))); ui.dirty=true; ui.msg=''; var y1=window.scrollY; render(); window.scrollTo(0,y1); return; }
  if(a==='pkgT'||a==='pkgD'){
    S.pkg=S.pkg||{total:'',done:''};
    var t=parseInt(S.pkg.total,10)||0, dn=parseInt(S.pkg.done,10)||0, v=+b.dataset.v;
    if(a==='pkgT'){ t=Math.max(0,t+v); if(dn>t) dn=t; } else { dn=Math.max(0,Math.min(t,dn+v)); }
    S.pkg.total=t?String(t):''; S.pkg.done=String(dn); ui.dirty=true; ui.msg='';
    var yy=window.scrollY; render(); window.scrollTo(0,yy); return;
  }
  if(a==='logEdit'){ ui.le={d:+b.dataset.d,n:b.dataset.n,w:+b.dataset.w}; var y3=window.scrollY; render(); window.scrollTo(0,y3); var inp1=document.getElementById('le-in'); if(inp1){ try{ inp1.focus({preventScroll:true}); }catch(err){ inp1.focus(); } } return; }
  if(a==='logCancel'){ ui.le=null; render(); return; }
  if(a==='infoEdit'){ ui.ie={d:+b.dataset.d,n:b.dataset.n}; ui.le=null; var y5=window.scrollY; render(); window.scrollTo(0,y5); var t1=document.getElementById('ie-in'); if(t1){ try{ t1.focus({preventScroll:true}); }catch(err){ t1.focus(); } } return; }
  if(a==='infoCancel'){ ui.ie=null; render(); return; }
  if(a==='infoSave'){
    var t2=document.getElementById('ie-in'); if(!t2||!ui.ie) return;
    var I=ui.ie, ex2=findEx(I.d,I.n); if(!ex2) return;
    var v2=t2.value.trim(), k2=ikey(I.d,ex2);
    if(v2===(ex2.info||'').trim() && !PEND[k2]){ ui.ie=null; render(); return; }
    PEND[k2]={f:'info',d:I.d,dn:(S.days[I.d]||{}).name||'',n:ex2.n,v:v2,ts:Date.now(),sent:false};
    pendSave(); ui.ie=null; var y6=window.scrollY; render(); window.scrollTo(0,y6); sendPend(k2); return;
  }
  if(a==='logSave'){ saveLog(); return; }
  var D=draft;
  if(a==='addDay') D.days.push({name:'DAY '+(D.days.length+1),focus:'',extra:[],ex:[{n:'',sr:'',info:'',rec:'',vids:[],lab:'',log:[]}]});
  if(a==='delDay') D.days.splice(i,1);
  if(a==='addEx') D.days[i].ex.push({n:'',sr:'',info:'',rec:'',vids:[],lab:'',log:[]});
  if(a==='addVid'){ D.days[i].ex[k].vids=D.days[i].ex[k].vids||[]; D.days[i].ex[k].vids.push({t:'',u:''}); }
  if(a==='delVid') D.days[i].ex[k].vids.splice(+b.dataset.j,1);
  if(a==='delEx') D.days[i].ex.splice(k,1);
  if(a==='up'){ var x=D.days[i].ex; x.splice(k-1,0,x.splice(k,1)[0]); }
  if(a==='addExtra'){ D.days[i].extra=D.days[i].extra||[]; D.days[i].extra.push({label:'',text:''}); }

  if(a==='gen') D.client.g=b.dataset.v;
  if(a==='addFix'){ D[b.dataset.w]=D[b.dataset.w]||[]; D[b.dataset.w].push({label:'',text:''}); }
  if(a==='delFix') D[b.dataset.w].splice(k,1);
  if(a==='delAppt') D.appts.splice(k,1);
  var y=window.scrollY; render(); window.scrollTo(0,y);
});

function clean(D){
  D.days.forEach(function(d){
    d.ex=(d.ex||[]).filter(function(e){return (e.n||'').trim();});
    d.ex.forEach(function(e){ e.vids=(e.vids||[]).filter(function(v){return (v.u||'').trim();}); var lg=(e.log||[]).map(function(x){return x||'';}); while(lg.length && !lg[lg.length-1].trim()) lg.pop(); e.log=lg; });
    d.extra=(d.extra||[]).filter(function(b){return (b.text||'').trim();});
  });
  D.appts=D.appts.filter(function(a){return a.d;});
  ['pre','post'].forEach(function(w){ D[w]=(D[w]||[]).filter(function(b){return (b.text||'').trim();}); });
  D.updated=today();
  return D;
}

function buildPage(D){
  var json = JSON.stringify(D).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>' +
    '<title>Programma '+esc((D.client.name||'Cliente').trim())+'</title>\n' +
    '<meta name="claude:viewport-fit-sides" content="cover">\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">\n' +
    '<style id="st">'+CSS+'</style>\n' +
    '<div id="app"><p class="empty">Caricamento del programma…</p></div>\n' +
    '<script type="application/json" id="data">'+json+'</scr'+'ipt>\n' +
    '<script id="app-js">'+SELF+'</scr'+'ipt>\n</body></html>';
}

var art = null;
async function save(){
  if(!art){ ui.msg='Il salvataggio non è disponibile in questa vista.'; render(); return; }
  ui.saving=true; ui.msg=''; render();
  try{
    await art.publish(buildPage(clean(draft)));
  }catch(err){
    ui.saving=false;
    var c = err && err.code;
    if(c==='conflict'){ ui.msg='La pagina è stata aggiornata altrove: si ricarica con la versione più recente.'; }
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'){ ui.canEdit=false; ui.edit=false; }
    else if(c==='too_large'){ ui.msg='Il programma è troppo grande per essere salvato. Accorcia qualche testo e riprova.'; }
    else if(c==='rate_limited'){ ui.msg='Troppi salvataggi ravvicinati. Aspetta qualche secondo e premi di nuovo Salva.'; }
    else { ui.msg='Salvataggio non riuscito. Controlla la connessione e premi di nuovo Salva.'; }
    render();
  }
}

render();
(async function(){
  try{
    if(!window.claude || !window.claude.use) return;
    var u = await window.claude.use('user');
    var can = false;
    if(u){ try{ can = !!(await u.canEdit()); }catch(e){} if(!can){ try{ can = !!(await u.isOwner()); }catch(e){} } }
    if(!can) return;
    art = await window.claude.use('artifact');
    if(!art) return;
    ui.canEdit = true; render();
  }catch(e){}
})();
})();
