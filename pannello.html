<style>
/* Layout: coach's roster — summary counts, search + filter, then one row per client with the states that need action */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --ink:#141C1A; --muted:#5D6B67; --line:#DCE2E0;
  --accent:#1B7D8D; --accent-ink:#FFFFFF; --accent-soft:#DDF0F2; --brand:#2397A9;
  --warn:#B4621A; --warn-soft:#FBEBDD; --rata-ink:#7A5600; --rata-bg:#FCEBB0; --ok-ink:#2E7D32; --ok-bg:#E2F3E2; --bad:#B3261E; --bad-soft:#FBE3E1;

  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1413; --surface:#182120; --ink:#E8EEEC; --muted:#93A29E; --line:#2A3634;
  --accent:#4FC3D3; --accent-ink:#062126; --accent-soft:#13333A; --brand:#3FB4C5;
  --warn:#E39A57; --warn-soft:#3A2A1A; --rata-ink:#F5CF5B; --rata-bg:#3B3112; --ok-ink:#7FD48A; --ok-bg:#1C3A22; --bad:#F08A82; --bad-soft:#3D2120; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1413; --surface:#182120; --ink:#E8EEEC; --muted:#93A29E; --line:#2A3634;
  --accent:#4FC3D3; --accent-ink:#062126; --accent-soft:#13333A; --brand:#3FB4C5;
  --warn:#E39A57; --warn-soft:#3A2A1A; --rata-ink:#F5CF5B; --rata-bg:#3B3112; --ok-ink:#7FD48A; --ok-bg:#1C3A22; --bad:#F08A82; --bad-soft:#3D2120; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

h1,h2{margin:0;text-wrap:balance}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand-name{font:800 21px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}

.logo{flex:0 0 auto;width:40px;height:auto;fill:var(--brand);stroke:var(--brand);stroke-width:22;stroke-linejoin:round;overflow:visible}
.eyebrow{font:700 13px/1 var(--display);letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.hero{display:flex;flex-direction:column;gap:6px}
.hero h1{font:800 clamp(40px,11vw,64px)/.9 var(--display);text-transform:uppercase}
.hero p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.stat strong{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums}

.stat.bad strong{color:var(--bad)}

.brand.hello{justify-content:space-between;align-items:center;gap:12px}
.brand.hello h1{font:800 clamp(34px,10vw,52px)/.92 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-align:left}
.brand.hello .logo{width:60px}
.splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;transition:opacity .45s ease}
.splash.out{opacity:0;pointer-events:none}
.splash .logo{width:96px;animation:spl-in .7s ease both}
.splash .s-name{font:800 30px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);animation:spl-in .7s .15s ease both}

@keyframes spl-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.sbox{position:relative;flex:1 1 220px;display:flex;min-width:0}
.sbox .search{padding-right:42px !important}
.search::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.sx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.sx svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none}
.search{flex:1 1 auto;width:100%;font:15px/1.4 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.row{position:relative;display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 16px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.who{min-width:0;display:flex;flex-direction:column;gap:6px}
.who b{font-size:16px;font-weight:600;line-height:1.25}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 12.5px/1 var(--body);padding:6px 8px;border-radius:7px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.next{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.tag.nonext{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.tag.next,.tag.nonext{display:inline-flex;align-items:center;gap:5px}
.tag svg{width:13px;height:13px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.tag.ok{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.tag.paid{color:var(--ok-ink);background:var(--ok-bg);border-color:transparent}
.tag.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.tag.rata{color:var(--rata-ink);background:var(--rata-bg);border-color:transparent}
.tag.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.open{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:600 14px/1 var(--body);color:var(--accent-ink);background:var(--accent);padding:10px 14px;border-radius:10px;white-space:nowrap}
.open svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center}
.foot{color:var(--muted);font-size:13px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.week-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px}
.week-h h2{white-space:nowrap;font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.week-h small{color:var(--muted);font-size:13px;white-space:nowrap}
.wday{display:flex;flex-direction:column;gap:6px}
.wday-t{font:700 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wday.today .wday-t{color:var(--accent)}
.wap{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg);text-decoration:none;color:inherit}

.wnone{color:var(--muted);font-size:14px;margin:0}

.site input{position:absolute;left:-9999px;width:1px;opacity:0;font:500 12.5px/1.2 var(--mono);color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 8px}

.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font:600 11px/1.1 var(--body);padding:7px 2px;border-radius:10px;cursor:pointer;text-align:center}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
.nav b{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;font:700 11px/18px var(--body);color:#fff;background:var(--bad)}
.nav b.w{background:var(--warn)}
.nav b.b{background:var(--accent);color:var(--accent-ink)}
#app{padding-bottom:110px !important}
@media (max-width:420px){.stat strong{font-size:28px}.stat span{font-size:10.5px}}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-top:4px}
.rc-r{display:grid;grid-template-columns:minmax(0,1fr) 30px 46px 54px 62px 34px;gap:4px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.rc-r:first-child{border-top:0}
.rc-r b{font-weight:600;overflow-wrap:break-word;line-height:1.2;font-size:13.5px}
.rc-hd{font:700 11px/1.1 var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.rc-hd span{text-align:right}
.rc-hd span:first-child{text-align:left}
.rc .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rc .n.blue{color:var(--brand)}
.rc .n.warn{color:#D9822B}
.rc .pay{border-radius:7px;padding:3px 5px}
.rc .pay.bad{color:#fff;background:#C62828}
.rc .pay.warn{color:#3B2A00;background:#F2C94C}
.rc .pay.ok{color:#fff;background:#2E7D32}
.rc-tot{font-weight:700}
.rc .np{color:var(--ink)}
.rc-hd span{font-size:10px}
.rc-tot b{font-weight:700}
.rc-r.ed{cursor:pointer}
.rc-r.on{background:var(--accent-soft);margin:0 -12px;padding-left:12px;padding-right:12px}
.rc-ed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 0 12px;border-top:1px dashed var(--line)}
.rc-ed label{min-width:0;display:flex;flex-direction:column;gap:4px;font:700 11px/1.1 var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.rc-ed input{font:16px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);min-width:0}
.rc-bt{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
.rc-bt button{font:600 14px var(--body);padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.rc-bt button[type=submit]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
</style>

  C.forEach(function(c){ (c.appts||[]).forEach(function(a){ days.forEach(function(x){ if(a.d===x.k) x.items.push({c:c,a:a}); }); }); });
  var n=0; days.forEach(function(x){ x.items.sort(function(p,q){ return (p.a.t||'').localeCompare(q.a.t||''); }); n+=x.items.length; });
  var fD = new Intl.DateTimeFormat('it-IT',{weekday:'long',day:'numeric',month:'short'});
  var h = '<section class="week" aria-label="Oggi e domani"><div class="week-h"><h2>Oggi e domani</h2><small>'+n+(n===1?' appuntamento':' appuntamenti')+'</small></div>';
  if(!n) h += '<p class="wnone">Nessun appuntamento oggi e domani.</p>';
  days.forEach(function(x,i){
    if(!x.items.length) return;
    var lab = i===0?'Oggi':(i===1?'Domani':fD.format(x.d));
    h += '<div class="wday'+(i===0?' today':'')+'"><span class="wday-t">'+esc(lab)+'</span>';
    x.items.forEach(function(it){
      var url = /^https:\/\/claude\.ai\//.test(it.c.url||'') ? it.c.url : '', w=(it.a.what||'Lezione'), mass=/massagg/i.test(w)&&!/lezion/i.test(w);
      var tag = url?'a':'div', past = parseD(it.a) < now && i===0;
      h += '<'+tag+' class="wap'+(past?' past':'')+'"'+(url?' href="'+esc(url)+'" target="_blank" rel="noopener"':'')+'><time>'+esc(it.a.t||'—')+'</time><b>'+esc(it.c.name)+'</b><i'+(mass?' class="mass"':'')+'>'+esc(w)+'</i></'+tag+'>';
    });
    h += '</div>';
  });
  return h + '</section>';
}

function eur(n){ return (Math.round(n*100)/100).toLocaleString('it-IT')+' €'; }
function viewRecap(rows){
  var now=new Date(), totP=0, totA=0, totN=0;
  var h='<section class="rc"><div class="rc-r rc-hd"><span>Cliente</span><span>Fatte</span><span>Rim.</span><span>Prezzo</span><span>Pagato</span><span>Tot.</span></div>';
  var rq=(ui.q||'').trim().toLowerCase();
  rows.filter(function(x){ return !rq || (x.c.name||'').toLowerCase().indexOf(rq)>=0; }).sort(function(a,b){ return (a.c.name||'').localeCompare(b.c.name||'','it'); }).forEach(function(x){
    var c=x.c, p=effPkg(c), mode=p.mode||((parseInt(p.total,10)>0)?'pack':'none'), f='—', l='—', lc='', pr='—', pa='—', pc='';
    if(mode==='pack'){ var tot=parseInt(p.total,10)||0;
      if(tot>0){ var dn=x.s.done!=null?x.s.done:(parseInt(p.done,10)||0), left=tot-dn; f=String(dn); l=String(left); lc=left<=2?'warn':'blue'; } }
    else if(mode==='month'){ var y=now.getFullYear(), m=now.getMonth(); f=String(oneADay((c.appts||[]).filter(function(a){ var d=parseD(a); return a.d && d.getFullYear()===y && d.getMonth()===m && d<now; })).length); l='mese'; }
    var price=parseFloat(p.price), paid=parseFloat(p.paidAmt);
    if(price>0){ pr=eur(price); totP+=price; }
    if(!isNaN(paid)){ pa=eur(paid); totA+=paid; pc = paid<=0 ? 'bad' : (price>0 && paid>=price ? 'ok' : 'warn'); }
    else if(mode!=='none' && x.s.pv){ pa = x.s.pv==='ok'?'Saldato':(x.s.pv==='rata'?'In parte':'0'); pc = x.s.pv==='ok'?'ok':(x.s.pv==='rata'?'warn':'bad'); }
    var hist=c.pkgHist||[], npk=hist.length+((mode==='pack' && parseInt(p.total,10)>0 && x.s.left===0 && !hist.some(function(q){ return q.start===p.start; }))?1:0); totN+=npk;
    var k=rcKey(c), op=(EDB||PF)&&rcOpen===k;
    h+='<div class="rc-r'+((EDB||PF)?' ed':'')+(op?' on':'')+'" data-rc="'+esc(k)+'"><b>'+esc(c.name)+'</b><span class="n '+lc+'">'+esc(f)+'</span><span class="n '+lc+'">'+esc(l)+'</span><span class="n">'+esc(pr)+'</span><span class="n pay '+pc+'">'+esc(pa)+'</span><span class="n np">'+npk+'</span></div>';
    if(op){ var tt=parseInt(p.total,10)||0, dd=x.s.done!=null?x.s.done:0; h+='<form class="rc-ed" data-rcf="'+esc(k)+'"><label>Fatte<input type="number" inputmode="numeric" min="0" name="done" value="'+(mode==='pack'&&tt?dd:'')+'"></label><label>Rimaste<input type="number" inputmode="numeric" min="0" name="left" value="'+(mode==='pack'&&tt?tt-dd:'')+'"></label><label>Prezzo €<input type="number" inputmode="decimal" min="0" name="price" value="'+esc(p.price||'')+'"></label><label>Pagato €<input type="number" inputmode="decimal" min="0" name="paidAmt" value="'+esc(p.paidAmt||'')+'"></label><div class="rc-bt"><button type="button" data-rcx="1">Annulla</button><button type="submit">Salva</button></div></form>'; }
  });
  h+='</section>';
  h+='<p class="foot">'+(rcMsg?esc(rcMsg)+' ':'')+((EDB||PF)?'Tocca un cliente per modificare lezioni, prezzo e pagato. Le modifiche arrivano nella sua pagina e nel suo sito con l’aggiornamento serale.':'Per modificare usa il pannello su Claude.')+'</p>';
  return h;
}
function render(){
  var rows = C.map(function(c){ return {c:c, s:status(c)}; });
  var nRenew = rows.filter(function(x){return x.s.renew;}).length;
  var nNo = rows.filter(function(x){return !x.s.up;}).length;
  var nPay = rows.filter(function(x){return x.s.unpaid;}).length;
  var q = ui.q.trim().toLowerCase();
  var list = rows.filter(function(x){
    if(q && (x.c.name||'').toLowerCase().indexOf(q)<0) return false;
    if(ui.f==='renew') return x.s.renew;
    if(ui.f==='noappt') return !x.s.up;
    if(ui.f==='pay') return x.s.unpaid;
    return true;
  }).sort(function(a,b){
    if(ui.f==='pay'){ var ka=a.s.pv==='no'?0:1, kb=b.s.pv==='no'?0:1; if(ka!==kb) return ka-kb; }
    if(ui.f==='renew'){ var rr=function(x){ return x.s.left===1?0:(x.s.left===2?1:2); }; if(rr(a)!==rr(b)) return rr(a)-rr(b); }
    var ua=a.s.up, ub=b.s.up;
    if(ua && ub){ var dd=parseD(ua)-parseD(ub); if(dd) return dd; }
    else if(ua||ub) return ua?-1:1;
    return (a.c.name||'').localeCompare(b.c.name||'','it');
  });
  var h = '<header class="brand hello"><h1>Pannello clienti</h1>'+LOGO+'</header>';
  h += '<div class="tools"><div class="sbox"><input class="search" id="q" type="search" placeholder="Cerca un cliente" aria-label="Cerca un cliente" value="'+esc(ui.q)+'">'+(ui.q?'<button type="button" class="sx" data-clr="1" aria-label="Cancella ricerca"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>':'')+'</div></div>';
  if(ui.f==='recap') h += viewRecap(rows);
  else if(!C.length) h += '<p class="empty">Ancora nessun cliente. Chiedimi di creare la pagina di un cliente e comparirà qui.</p>';
  else if(!list.length) h += '<p class="empty">Nessun cliente corrisponde.</p>';
  else {
    h += '<ul class="list">';
    list.forEach(function(x){
      var url = /^https:\/\/claude\.ai\//.test(x.c.url||'') ? x.c.url : '';
      var site = x.c.site || SITES[x.c.url||''] || '', site = /^https:\/\//.test(site) ? site : '';
      h += '<li class="row"><div class="who"><b>'+esc(x.c.name)+'</b><div class="tags">'+x.s.tags.map(function(t){ return '<span class="tag '+t.c+'">'+((t.c==='next'||t.c==='nonext')?CAL:'')+esc(t.t)+'</span>'; }).join('')+'</div></div>'+
        (url?'<a class="open" href="'+esc(url)+'" target="_blank" rel="noopener">Apri'+ARROW+'</a>':'')+
        (site?'<div class="site"><span>Link per il cliente: '+esc(site.replace(/^https:\/\//,''))+'</span><input type="text" readonly tabindex="-1" aria-hidden="true" value="'+esc(site)+'"><button type="button" data-copy="'+esc(site)+'">Copia link</button><a href="'+esc(site)+'" target="_blank" rel="noopener">Apri il sito</a></div>':'')+'</li>';
    });
    h += '</ul>';
  }
  if(D.updated){ try{ h += '<p class="foot">Dati aggiornati il '+esc(new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'long'}).format(parseD({d:D.updated})))+'. Si aggiornano ogni sera insieme agli appuntamenti.</p>'; }catch(e){} }
  var I = {recap:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',all:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
    noappt:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M10 14l4 4M14 14l-4 4"/></svg>',
    renew:'<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3.6M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3.6M20 20v-4h-4"/></svg>',
    pay:'<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg>'};
  var NB = [['all','Clienti',C.length,'b'],['noappt','Senza app.',nNo,''],['renew','Da rinnovare',nRenew,'w'],['pay','Da pagare',nPay,''],['recap','Recap',0,'']];
  h += '<nav class="nav" aria-label="Navigazione"><div class="nav-in">'+NB.map(function(n){ return '<button type="button" data-nav="'+n[0]+'" aria-current="'+(ui.f===n[0])+'">'+I[n[0]]+(n[2]?'<b class="'+n[3]+'">'+n[2]+'</b>':'')+'<span>'+n[1]+'</span></button>'; }).join('')+'</div></nav>';
  app.innerHTML = h;
}

app.addEventListener('click', function(e){
  var cp = e.target.closest('[data-copy]');
  if(cp){
    var v = cp.dataset.copy, ok = function(){ cp.textContent='Copiato!'; cp.classList.add('done'); setTimeout(function(){ cp.textContent='Copia link'; cp.classList.remove('done'); },1800); };
    var fb = function(){ var inp = cp.parentNode.querySelector('input'); inp.focus(); inp.select(); try{ if(document.execCommand('copy')) ok(); else cp.textContent='Tieni premuto e copia'; }catch(err){ cp.textContent='Tieni premuto e copia'; } };
    try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(ok, fb); else fb(); }catch(err){ fb(); }
    return;
  }
  if(e.target.closest('[data-clr]')){ ui.q=''; render(); try{ document.activeElement && document.activeElement.blur(); }catch(err){} return; }
  var nv = e.target.closest('[data-nav]');
  if(nv){ ui.f = nv.dataset.nav; try{ localStorage.setItem('pc-filter', ui.f); }catch(err){} render();
    window.scrollTo(0,0);
    return; }
  var b = e.target.closest('[data-f]'); if(!b) return;
  ui.f = (ui.f===b.dataset.f && b.dataset.f!=='all') ? 'all' : b.dataset.f;
  try{ localStorage.setItem('pc-filter', ui.f); }catch(err){}
  render();
});
app.addEventListener('click', function(e){
  if(ui.f!=='recap' || !(EDB||PF)) return;
  if(e.target.closest('[data-rcx]')){ rcOpen=null; render(); return; }
  if(e.target.closest('.rc-ed')) return;
  var r=e.target.closest('[data-rc]'); if(!r) return;
  rcOpen = rcOpen===r.dataset.rc ? null : r.dataset.rc; rcMsg=''; render();
});
app.addEventListener('submit', function(e){
  var fm=e.target.closest('[data-rcf]'); if(!fm || !(EDB||PF)) return; e.preventDefault();
  var k=fm.dataset.rcf, c=C.filter(function(x){ return rcKey(x)===k; })[0]; if(!c) return;
  var v=function(n){ var x=fm.elements[n].value.trim(); return x===''?null:x; };
  var p=effPkg(c), st=status(c), cur=st.done!=null?st.done:0, adj0=parseInt(p.adj,10)||0, o={ts:Date.now(), name:c.name};
  var dn=v('done'), lf=v('left');
  if(dn!=null){ dn=Math.max(0,parseInt(dn,10)||0); o.adj=String(adj0+(dn-cur)); } else dn=cur;
  if(lf!=null) o.total=String(dn+Math.max(0,parseInt(lf,10)||0));
  if(v('price')!=null) o.price=v('price');
  if(v('paidAmt')!=null) o.paidAmt=v('paidAmt');
  var prev=ED[k]||{}; ED[k]=Object.assign({},prev,o); rcOpen=null; rcMsg='Salvato.'; render();
  if(EDB){ EDB.collection('edits').doc(k).set(ED[k]).catch(function(){ rcMsg='Non salvato, riprova.'; render(); }); return; }
  try{ var lo=JSON.parse(localStorage.getItem('rc-edits')||'{}'); lo[k]=ED[k]; localStorage.setItem('rc-edits', JSON.stringify(lo)); }catch(err){}
  var row={s:'__panel',f:'recap',k:k,t:o.ts}; ['total','adj','price','paidAmt'].forEach(function(n){ if(ED[k][n]!=null) row[n]=ED[k][n]; });
  var fd=new FormData(); fd.append(PF.entry, JSON.stringify(row));
  fetch(PF.action,{method:'POST',mode:'no-cors',body:fd}).catch(function(){ rcMsg='Non inviato: controlla la connessione e riprova.'; render(); });
});
app.addEventListener('input', function(e){
  if(e.target.id!=='q') return;
  ui.q = e.target.value; var pos = e.target.selectionStart;
  render(); var i = document.getElementById('q'); i.focus(); try{ i.setSelectionRange(pos,pos); }catch(err){}
});
render();
try{ var sp=document.getElementById('splash0'); if(!sp){ sp=document.createElement('div'); sp.className='splash'; sp.setAttribute('aria-hidden','true'); sp.innerHTML=LOGO+'<div class="s-name">Matteo D’Avolio</div><div class="s-role">Personal Trainer &amp; Massaggiatore sportivo</div>'; document.body.appendChild(sp); } var wait=2000; try{ wait=Math.max(500,2000-Math.round(performance.now())); }catch(e){} setTimeout(function(){ sp.classList.add('out'); setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },500); },wait); }catch(e){}
try{ if('serviceWorker' in navigator && location.protocol==='https:' && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(function(){}); }catch(e){}
setInterval(function(){ var q=document.getElementById('q'); if(q && document.activeElement===q) return; render(); }, 60000);
})();
